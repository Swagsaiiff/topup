                <div class="user-details">
                    <h3 id="adminName">Admin</h3>
                    <p id="adminEmail">tahsan897@gmail.com</p>
                </div>
                <button class="logout-btn" onclick="logout()">Logout</button>
            </div>
        </div>

        <!-- Admin Statistics -->
        <div class="admin-stats">
            <div class="stat-card">
                <h3>Today's Sales</h3>
                <div class="stat-value" id="todaySales">৳0</div>
            </div>
            <div class="stat-card">
                <h3>Total Users</h3>
                <div class="stat-value" id="totalUsers">0</div>
            </div>
            <div class="stat-card">
                <h3>Pending Orders</h3>
                <div class="stat-value" id="pendingOrders">0</div>
            </div>
            <div class="stat-card">
                <h3>Completed Orders</h3>
                <div class="stat-value" id="completedOrders">0</div>
            </div>
        </div>

        <div class="nav-tabs">
            <button class="nav-tab active" onclick="showSection('orders')">Orders</button>
            <button class="nav-tab" onclick="showSection('addMoney')">Add Money Requests</button>
            <button class="nav-tab" onclick="showSection('profile')">Profile</button>
        </div>

        <!-- Orders Section -->
        <div id="orders" class="content-section active">
            <div class="orders-section">
                <h2>All Orders</h2>
                <div id="allOrdersList">
                    <p>Loading orders...</p>
                </div>
            </div>
        </div>

        <!-- Add Money Requests Section -->
        <div id="addMoney" class="content-section">
            <div class="orders-section">
                <h2>Add Money Requests</h2>
                <div id="addMoneyRequestsList">
                    <p>Loading requests...</p>
                </div>
            </div>
        </div>

        <!-- Profile Section -->
        <div id="profile" class="content-section">
            <div class="wallet-section">
                <h2>Admin Profile</h2>
                <form id="adminProfileForm">
                    <div class="form-row">
                        <input type="text" id="adminDisplayName" placeholder="Display Name" required>
                        <input type="email" id="adminEmailInput" placeholder="Email" required>
                    </div>
                    <div class="form-row">
                        <input type="password" id="adminNewPassword" placeholder="New Password (optional)">
                        <input type="password" id="adminConfirmPassword" placeholder="Confirm Password">
                    </div>
                    <button type="submit" class="btn-primary">Update Profile</button>
                </form>
            </div>
        </div>
    </div>

    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    <script src="js/firebase-config.js"></script>
    <script src="js/admin-dashboard.js"></script>
</body>
</html>
